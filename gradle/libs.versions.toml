[versions]
agp = "9.3.3"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
navigation = "2.9.8"
coreSplashscreen = "1.2.0"
retrofit = "3.0.0"
gson = "2.14.0"
lifecycle = "2.11.0"
markwon = "4.6.2"
recyclerview = "1.4.0"
